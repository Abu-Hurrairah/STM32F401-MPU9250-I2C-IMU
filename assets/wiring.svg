<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <rect width="1400" height="360" rx="26" fill="#0b1220"/>
  <style>
    .box{fill:#111c2d;stroke:#38bdf8;stroke-width:3}
    .h{fill:#fff;font:700 28px monospace;text-anchor:middle}
    .t{fill:#b6c6d6;font:19px monospace}
    .wire{stroke:#22d3ee;stroke-width:5;fill:none}
  </style>
  <rect class="box" x="80" y="55" width="420" height="250" rx="20"/>
  <text class="h" x="290" y="105">MPU9250</text>
  <text class="t" x="135" y="160">SCL</text>
  <text class="t" x="135" y="205">SDA</text>
  <text class="t" x="135" y="250">GND</text>
  <text class="t" x="135" y="295">AD0</text>

  <rect class="box" x="600" y="55" width="420" height="250" rx="20"/>
  <text class="h" x="800" y="105">STM32F401</text>
  <text class="t" x="800" y="160">PB6 / I2C1_SCL</text>
  <text class="t" x="800" y="205">PB7 / I2C1_SDA</text>
  <text class="t" x="800" y="250">GND</text>
  <text class="t" x="800" y="295">Logic Low → 0x68</text>

  <path class="wire" d="M220 153H900"/>
  <path class="wire" d="M220 198H900"/>
  <path class="wire" d="M220 243H900"/>
  <path class="wire" d="M220 288H900"/>
